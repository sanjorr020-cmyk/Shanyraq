<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Схема: магазин Shanyraq на ул. Акан Серы, остановка на ул. Дружбы">
  <rect width="640" height="400" fill="#F4F2EE"/>
  <!-- кварталы -->
  <g fill="#E7E4DD">
    <rect x="40" y="40" width="170" height="110" rx="6"/>
    <rect x="260" y="40" width="130" height="110" rx="6"/>
    <rect x="430" y="40" width="170" height="110" rx="6"/>
    <rect x="40" y="250" width="170" height="110" rx="6"/>
    <rect x="260" y="250" width="130" height="110" rx="6"/>
    <rect x="430" y="250" width="170" height="110" rx="6"/>
  </g>
  <!-- дороги -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <path d="M0 200 H640" stroke-width="30"/>
    <path d="M230 0 V400" stroke-width="24"/>
  </g>
  <path d="M0 200 H640 M230 0 V400" stroke="#D9D5CC" stroke-width="1.5" fill="none"/>
  <!-- подписи дорог -->
  <text x="420" y="188" font-family="Arial, sans-serif" font-size="14" fill="#6B6B6B">ул. Акан Серы</text>
  <text x="240" y="30" font-family="Arial, sans-serif" font-size="14" fill="#6B6B6B" transform="rotate(90 240 30)">ул. Дружбы</text>
  <!-- остановка -->
  <circle cx="262" cy="150" r="9" fill="#1E4E8C"/>
  <text x="278" y="146" font-family="Arial, sans-serif" font-size="13" fill="#1C1B1A">Остановка</text>
  <text x="278" y="162" font-family="Arial, sans-serif" font-size="12" fill="#6B6B6B">2 мин пешком</text>
  <!-- магазин -->
  <path d="M330 198 C318 180 306 166 306 150 A24 24 0 0 1 354 150 C354 166 342 180 330 198 Z" fill="#C8102E"/>
  <circle cx="330" cy="150" r="8" fill="#FFFFFF"/>
  <text x="338" y="232" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1B1A">Shanyraq</text>
  <text x="12" y="390" font-family="Arial, sans-serif" font-size="12" fill="#6B6B6B">Схема для сайта, не в масштабе</text>
</svg>
